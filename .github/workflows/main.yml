name: NewsBot_Mistral_Final
on:
  schedule:
    - cron: '30 17 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install Ollama & Pull Mistral
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve > ollama.log 2>&1 &
          sleep 30 # Servisin başlaması için daha uzun bekleme
          ollama pull mistral
          
      - name: Dependencies
        run: pip install requests pytrends beautifulsoup4 feedparser lxml
        
      - name: Run Bot
        env:
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: python bot.py
        
      - name: Push
        run: |
          git config --global user.name "NewsBot"
          git config --global user.email "bot@news.com"
          git add *.txt
          git commit -m "Ferah Gündem: $(date)" || exit 0
          git push
