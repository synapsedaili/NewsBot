name: DailyContentGenerator
on:
  schedule:
    - cron: '30 17 * * *' # 20:30 TR Time (To be ready by 21:00)
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # Transitioning to 3.11 as requested
          
      - name: Install Ollama & Pull Model
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve & 
          sleep 10
          ollama pull qwen2.5:0.5b
          
      - name: Run Bot
        run: python bot.py
        
      - name: Commit and Push Changes
        run: |
          git config --global user.name "SynapseDaily-Bot"
          git config --global user.email "bot@synapsedaily.com"
          git add *.txt
          git commit -m "Daily content for $(date +'%d-%m-%Y')"
          git push
